[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.88"
publish = false
repository = "https://github.com/marcinwadon/hennery"
homepage = "https://github.com/marcinwadon/hennery"

[workspace.dependencies]
agent-client-protocol = "=2.2.0"
anyhow = "1"
# Images in prompts (plan 6a): decoded at the collector.
base64 = "=0.22.1"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4", features = ["derive", "env"] }
# The MCP gateway's credentials at rest (plan 8a): XChaCha20-Poly1305.
# Default features off: no random number generator of its own (nonces come
# from the kernel's), and its key state zeroized when dropped.
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
ed25519-dalek = "=2.2.0"
# Package and Node archives (plan 7b): pure Rust, no liblzma.
flate2 = "=1.1.10"
futures = "0.3"
getrandom = "=0.3.4"
hex = "=0.4.3"
# The MCP gateway binds an upstream's Mcp-Session-Id to its token (plan 8e
# decision 13): HMAC-SHA256 over sha2 0.10, already in the lock.
hmac = "=0.12.1"
password-auth = "=1.0.0"
# Hat logos (plan 4d-B2): a PNG upload decoded and written afresh. No other
# image format: the review's ruling B.
png = "=0.18.1"
# Web Push (plan 10a): the VAPID key pair (kernel spec §6); `ecdsa` signs
# its tokens (RFC 8292).
p256 = { version = "=0.13.2", features = ["ecdsa"] }
# Web Push (plan 10b-ii): RFC 8291's encryption only. Default features off:
# `vapid` pulls in `jwt-simple`, and with it `rsa` (plan 10a decision 2).
web-push-native = { version = "=0.5.0", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
# Default features off: never unpack extended attributes (plan 7b).
tar = { version = "=0.4.46", default-features = false }
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = "0.29"
tokio-util = { version = "0.7", features = ["compat"] }
toml = "=1.1.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "12", features = ["serde-json-impl"] }
url = "=2.5.8"
uuid = { version = "1", features = ["v7", "serde"] }
# Passkeys (plan 3c). Default features off: passkeys ask for no attestation.
webauthn-rs = { version = "=0.5.5", default-features = false }
# The VAPID key's bytes (plan 10a) are wiped from memory once read.
zeroize = "=1.9.0"
# Tests only: a software passkey, so no browser is needed.
webauthn-authenticator-rs = { version = "=0.5.5", features = ["softpasskey"] }
# The release build only (plan 7a): `webauthn-rs-core` links OpenSSL, built
# from source and linked statically there (distribution spec §1.1).
openssl = "=0.10.81"
hennery-proto = { path = "crates/hennery-proto" }
hennery-kernel = { path = "crates/hennery-kernel" }
hennery-sessions = { path = "crates/hennery-sessions" }
hennery-host = { path = "crates/hennery-host" }
hennery-gateway = { path = "crates/hennery-gateway" }
hennery-view = { path = "crates/hennery-view" }

# Argon2 is unusably slow unoptimised; every test that logs in pays for it.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Image prompts (plan 6a) decode and hash up to 16 MiB each; the tests do
# that many times over.
[profile.dev.package.base64]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

# Release archives (plan 7a): `dist build` builds with this profile.
[profile.dist]
inherits = "release"
lto = "thin"
