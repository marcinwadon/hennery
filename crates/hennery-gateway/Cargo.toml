[package]
name = "hennery-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# Never `hennery-sessions`, in any table (umbrella §9, gateway spec §10):
# `tests/boundary.rs` reads the manifests and fails if it appears.
[dependencies]
anyhow.workspace = true
axum.workspace = true
# OAuth (plan 8f): PKCE's base64url and a client's Basic credentials.
base64.workspace = true
chacha20poly1305.workspace = true
# The proxy (plan 8d): its bodies are streams.
futures.workspace = true
hennery-kernel.workspace = true
hennery-proto.workspace = true
hex.workspace = true
libc = "0.2"
# The proxy's upstream requests (plan 8d), sent through the kernel's egress
# clients (`hennery_kernel::egress`), never a client of its own.
reqwest.workspace = true
rusqlite.workspace = true
# What the proxy reads of JSON-RPC (plan 8d): duplicate keys refused.
serde.workspace = true
serde_json.workspace = true
# OAuth (plan 8f): PKCE's S256 challenge (RFC 7636).
sha2.workspace = true
thiserror.workspace = true
# The proxy answers refused server requests in the background (plan 8d).
tokio.workspace = true
tracing.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true
# The store's unit tests read what its statements touch (`hooks`).
rusqlite = { workspace = true, features = ["hooks"] }
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true
tower = { version = "0.5", features = ["util"] }
tracing-subscriber.workspace = true
