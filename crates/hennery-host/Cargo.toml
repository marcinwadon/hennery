[package]
name = "hennery-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
publish = ["crates-io"]
readme = "README.md"
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/build.rs", "/manifest.json"]
description = "Host supervisor and managed adapter runtime for hennery"

[features]
# Seams that let tests hold the session actor still (`session::test_hooks`).
# Enabled only by hennery-testkit's dev-dependency, never in a real build.
test-hooks = []

[dependencies]
agent-client-protocol.workspace = true
anyhow.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
flate2.workspace = true
futures.workspace = true
getrandom.workspace = true
hennery-proto.workspace = true
hex.workspace = true
libc = "0.2"
reqwest.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
x509-parser.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
# The process's log output, with the message-tracing targets capped (plan 8c).
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hennery-testkit = { path = "../hennery-testkit" }
tempfile = "3"
