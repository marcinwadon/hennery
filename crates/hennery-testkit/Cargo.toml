[package]
name = "hennery-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "hennery-fake-acp"
path = "src/bin/hennery-fake-acp.rs"

# Codex's CLI as a forget runs it: `--version` and `app-server` (plan 9d-ii).
[[bin]]
name = "hennery-fake-codex"
path = "src/bin/hennery-fake-codex.rs"

[dependencies]
agent-client-protocol.workspace = true
# The fake adapter echoes each image it is sent by its hash (plan 6a).
base64.workspace = true
hennery-kernel.workspace = true
hex.workspace = true
libc = "0.2"
reqwest.workspace = true
rcgen = "=0.14.10"
rustls.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true

[dev-dependencies]
anyhow.workspace = true
# A fake MCP upstream for the gateway end to end (plan 8e).
axum.workspace = true
futures.workspace = true
# The owner audit reads the gateway's store too (plan 8a).
hennery-gateway.workspace = true
hennery-host = { workspace = true, features = ["test-hooks"] }
hennery-proto.workspace = true
hennery-sessions = { workspace = true, features = ["test-hooks"] }
hennery-view.workspace = true
# Hat logos (plan 4d-B2): test images are made by the encoder, never stored.
png.workspace = true
# Skill archives in the skills API tests (skills spec §5).
tar.workspace = true
flate2.workspace = true
rusqlite = { workspace = true, features = ["hooks"] }
tempfile = "3"
tokio-tungstenite.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
webauthn-authenticator-rs.workspace = true
webauthn-rs.workspace = true
