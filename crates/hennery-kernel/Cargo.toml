[package]
name = "hennery-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
publish = ["crates-io"]
readme = "README.md"
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/build.rs", "/package_ui.rs", "/web-dist/**", "/release-ui.json", "/FRONTEND-NOTICES.txt", "/SOURCE.json"]
description = "Storage, authentication, HTTP kernel and embedded UI for hennery"

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
hennery-proto.workspace = true
hex.workspace = true
hyper.workspace = true
hyper-util.workspace = true
libc = "0.2"
p256.workspace = true
ece-native.workspace = true
hkdf.workspace = true
password-auth.workspace = true
png.workspace = true
# Outbound HTTP (plan 8b): the egress policy's clients.
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
webauthn-rs.workspace = true
zeroize.workspace = true

# The web UI's build is embedded by `build.rs` (plan 4b): it hashes each file.
[build-dependencies]
hex.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
futures.workspace = true
# Independent RFC 8291 receiver backed by OpenSSL.
ece = { version = "=2.4.2", default-features = false, features = ["backend-openssl"] }
tempfile = "3"
# Delivery's retry waits run on a paused clock (plan 10b-ii).
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
tracing-subscriber.workspace = true
webauthn-authenticator-rs.workspace = true
