# The adapter pins (umbrella spec §12.3, distribution spec §3.1). A release
# IS a tested adapter set, and the pin decides what model aliases resolve
# to: a product decision, not a detail. After changing a pin:
#
#   cargo run -p hennery-pins -- lock      # package.json + package-lock.json
#   cargo run -p hennery-pins -- generate  # crates/hennery-host/manifest.json
#
# The pin-bump CI job (`.github/workflows/pins.yml`) then checks the
# manifest, the registry signatures and Node's signed checksums. The live
# e2e gate (umbrella §14) is the operator's to run, with logged-in agents,
# and so is the checklist in packaging/README.md ("Pin bumps").

# npm resolves the lockfiles as of this instant, so `lock` is reproducible.
# Committed locks may include targeted security refreshes (packaging/README.md).
npm_before = "2026-10-29T16:55:16Z"

[node]
# Stable Node 24 runtime; refreshed with the agent set on 2026-10-28.
# Security update 2026-10-22: CVE-2026-111497.
version = "24.22.2"

[adapters.claude]
# Adapter and SDK are pinned independently; see packaging/README.md.
package = "@agentclientprotocol/claude-agent-acp"
version = "0.99.0"
entry = "dist/index.js"
# The bundled Claude CLI: the SDK's platform packages. Proprietary, so never
# redistributed (distribution §3.3); skipped by `--use-cli claude=…`.
cli = ["node_modules/@anthropic-ai/claude-agent-sdk-"]

[adapters.codex]
# Adapter and CLI are pinned independently; see packaging/README.md.
# `@zed-industries/codex-acp` is deprecated in its favour; the unscoped
# `codex-acp` is an unrelated third party.
package = "@agentclientprotocol/codex-acp"
version = "2.5.0"
entry = "dist/index.js"
# The bundled Codex CLI: `@openai/codex`'s platform packages (npm aliases of
# `@openai/codex@<version>-<platform>`); skipped by `--use-cli codex=…`.
cli = ["node_modules/@openai/codex-"]

# How a forget deletes a Codex session's thread (plan 9d decision 9):
# `<node> <bin> app-server`, `initialize`, then `thread/delete`, with the
# call shape read from this Codex version's source (`rust-v0.165.0`,
# `app-server-protocol`). The generator refuses it unless the codex
# lockfile bundles exactly `codex_version`; a bump re-reads the shape, and
# the live check in packaging/README.md ("Pin bumps") is the operator's.
[codex_app_server]
codex_version = "0.165.0"
bin = "node_modules/@openai/codex/bin/codex.js"
delete_method = "thread/delete"
params_shape = { threadId = "{thread_id}" }

[codex_app_server.initialize.clientInfo]
name = "hennery"
title = "hennery"
version = "1"

[adapters.claude.overrides]
"@anthropic-ai/claude-agent-sdk" = "0.3.312"

[adapters.codex.overrides]
"@openai/codex" = "0.165.0"
