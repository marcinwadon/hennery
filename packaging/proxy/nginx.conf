pid @ROOT@/nginx.pid;
error_log @ROOT@/nginx-error.log warn;
worker_processes 1;
events { worker_connections 1024; }
http {
    access_log off;
    client_body_temp_path @ROOT@/body;
    proxy_temp_path @ROOT@/proxy;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    limit_conn_zone $binary_remote_addr zone=connections:10m;
    limit_req_zone $binary_remote_addr zone=requests:10m rate=100r/s;
    limit_conn_zone $server_name zone=server_connections:10m;
    server {
        listen @BIND_V4@:@TLS_PORT@ ssl;
        listen [@BIND_V6@]:@TLS_PORT@ ssl;
        server_name _;
        ssl_certificate @CERT@;
        ssl_certificate_key @KEY@;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_header_timeout 10s;
        client_body_timeout 10s;
        keepalive_timeout 30s;
        # Collector routes enforce their own limits, including images and WSS.
        client_max_body_size 0;
        limit_conn connections 20;
        limit_conn server_connections 256;
        limit_req zone=requests burst=200 nodelay;
        location / {
            proxy_pass http://127.0.0.1:@BACKEND_PORT@;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Hennery-Client-IP $remote_addr;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            gzip off;
            proxy_next_upstream off;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}
