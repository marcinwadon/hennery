  # Scratch only (plan 7e-ii-a): the Linux revert-probes, each expected to
  # make its check fail. Never part of the real PR.
  probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: KVM for the NixOS test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - name: Linux revert-probes
        run: PROBE_SCRATCH=/tmp/probes python3 .github/scratch-probes.py . linux
      - name: Probe logs
        if: always()
        run: tail -n 60 /tmp/probes/*.log
