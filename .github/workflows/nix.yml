# Scheduled maintenance; the filename keeps the documented Nix recipe runner stable.
name: maintenance
'on':
  schedule:
  - cron: 23 5 * * *
  - cron: 17 4 * * 1
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702
      with:
        github_access_token: ${{ github.token }}
    - name: Audit the lock against a freshly fetched RustSec database
      run: |
        audit_db=$(mktemp -d "$RUNNER_TEMP/rustsec.XXXXXX")
        nix develop .#release -c cargo-audit audit --file Cargo.lock --db "$audit_db"
        git -C "$audit_db" rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
    - name: Query current registry advisories for every locked web dependency
      run: nix develop .#web -c pnpm --dir web audit
    - name: Query current registry advisories for both managed adapter locks
      run: nix develop -c sh packaging/audit-adapters.sh
    - name: Check the live crates.io existence contract (read-only)
      run: |
        nix develop .#release -c node --input-type=module <<'JS'
        import assert from 'node:assert/strict';
        import {crateExists} from './packaging/publish-crates.mjs';
        assert.equal(await crateExists('hennery-proto','0.0.0-existence-probe-never-published'),false);
        assert.equal(await crateExists('serde','1.0.0'),true);
        console.log('crates.io: missing version = 404, serde/1.0.0 = 200');
        JS
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 5 * * *'
  flake:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 4 * * 1'
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-24.04-arm
          system: aarch64-linux
        - os: macos-15
          system: aarch64-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      HENNERY_WEB_REQUIRE: '1'
      CI: '1'
      HENNERY_REQUIRE_SHELLS: ${{ matrix.system == 'aarch64-linux' && 'bash,zsh,fish' || '' }}
      HENNERY_REQUIRE_SYSTEMD_ANALYZE: ${{ matrix.system == 'aarch64-linux' && '1' || '' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702
      with:
        github_access_token: ${{ github.token }}
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        shared-key: native-debug
        # Runner image env drifts; the flake pins the toolchain.
        add-rust-environment-hash-key: false
        cmd-format: nix develop -c {0}
        cache-bin: false
        save-if: false
    - name: Full Rust and web platform suites
      run: |
        nix develop -c bash -e -o pipefail <<'SH'
        pnpm --dir web install --frozen-lockfile
        pnpm --dir web typecheck
        pnpm --dir web test
        pnpm --dir web build
        node --check crates/hennery-memory/src/ui-client.mjs
        node --test crates/hennery-memory/tests/ui-client.test.mjs
        cargo fmt --all --check
        cargo clippy --workspace --all-targets --locked -- -D warnings
        cargo clippy -p hennery --locked -- -D warnings
        sh packaging/ci-rust-tests.sh
        cargo run -p hennery-proto --bin gen --locked -- --check
        cargo run -p hennery-view --bin gen-view --locked -- --check
        cargo build -p hennery -p hennery-testkit --bins --locked
        pnpm --dir web e2e
        cargo build -p hennery-memory --bin hennery-memory --locked
        node crates/hennery-memory/tests/browser.mjs
        SH
    - name: Nix platform package, source inputs and embedded UI
      env:
        SYSTEM: ${{ matrix.system }}
      run: |
        nix develop .#release -c python3 packaging/check-nix-args.py
        nix build -L ".#checks.$SYSTEM.package" ".#checks.$SYSTEM.source-inputs" ".#checks.$SYSTEM.web-ui"
        nix run . -- --version
    - name: The README Nix recipe
      run: |
        sh packaging/readme-blocks.sh README.md nix > "$RUNNER_TEMP/nix.sh"
        sh -eux "$RUNNER_TEMP/nix.sh"
  readme:
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702
      with:
        github_access_token: ${{ github.token }}
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        shared-key: native-release
        # Runner image env drifts; the flake pins the toolchain.
        add-rust-environment-hash-key: false
        cmd-format: nix develop -c {0}
        cache-bin: false
        save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    - name: The README's clone block
      run: |
        sh packaging/readme-blocks.sh README.md clone > "$RUNNER_TEMP/clone.sh"
        scratch=$(mktemp -d)
        (cd "$scratch" && sh -eux "$RUNNER_TEMP/clone.sh" && test -f hennery/Cargo.toml)
        rm -rf "$scratch"
    - name: The README's build block
      run: |
        sh packaging/readme-blocks.sh README.md build > "$RUNNER_TEMP/build.sh"
        cat >> "$RUNNER_TEMP/build.sh" <<'SH'
        sh packaging/check-web-ui.sh "$(command -v hennery)"
        SH
        sh -eux "$RUNNER_TEMP/build.sh"
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 4 * * 1'
  readme-without-nix:
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: stable
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '>=24.22.1 <25'
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        shared-key: native-release-vendored
        # Runner image env drifts; the flake pins the toolchain.
        add-rust-environment-hash-key: false
        cache-bin: false
        save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    - name: Vendored OpenSSL build tools (ubuntu)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y build-essential perl
    - name: Vendored OpenSSL build tools (macOS)
      if: runner.os == 'macOS'
      run: xcode-select -p && cc --version && make --version && perl -v
    - name: The README's build without Nix block
      run: |
        sh packaging/readme-blocks.sh README.md build-without-nix > "$RUNNER_TEMP/build-without-nix.sh"
        cat >> "$RUNNER_TEMP/build-without-nix.sh" <<'CHECK'
        sh packaging/check-web-ui.sh "$(command -v hennery)"
        CHECK
        sh -eux "$RUNNER_TEMP/build-without-nix.sh"
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 4 * * 1'

  crates:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 4 * * 1'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      R3_EXTENDED: 'true'
      R3_TARGET_DIR: ${{ github.workspace }}/target/crates-acceptance
      R3_REGISTRY_PORT: '37401'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702
      with:
        github_access_token: ${{ github.token }}
    - name: Isolate acceptance and MSRV homes
      run: |
        mkdir -p "$RUNNER_TEMP/crates-home"
        for name in HOME CARGO_HOME RUSTUP_HOME XDG_CONFIG_HOME XDG_CACHE_HOME XDG_DATA_HOME npm_config_userconfig npm_config_cache; do
          echo "$name=$RUNNER_TEMP/crates-home/$name" >> "$GITHUB_ENV"
        done
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        shared-key: crates-acceptance
        # Runner image env drifts; the flake pins the toolchain.
        add-rust-environment-hash-key: false
        save-if: ${{ github.ref == 'refs/heads/main' }}
        cmd-format: nix develop -c {0}
        workspaces: . -> target/crates-acceptance
        cache-bin: false
    - name: Locked, unlocked and MSRV consumer installs of frozen tarballs
      env:
        R3_CARGO_HOME: ${{ runner.temp }}/r3-acceptance-cargo
      run: |
        nix develop -c rustup toolchain install 1.88.0 --profile minimal
        nix develop -c node packaging/prepare-crates.mjs "$RUNNER_TEMP/crates-prepared" "$GITHUB_SHA"
        nix develop -c sh packaging/ci-crates.sh "$RUNNER_TEMP/crates-prepared"
