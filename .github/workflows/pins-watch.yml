name: pins-watch

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pins-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      updates: ${{ steps.latest.outputs.updates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            adapters/pins.toml
            adapters/claude/package-lock.json
            adapters/codex/package-lock.json
            packaging/pins_watch.py
          sparse-checkout-cone-mode: false
      - name: Compare upstream adapter, CLI/SDK and Node releases with the pins
        id: latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          updates=$(python3 packaging/pins_watch.py discover)
          if [ "$updates" != '[]' ] && [ "${DRY_RUN:-0}" != 1 ]; then
            branch=$(jq -er '.[0].branch' <<< "$updates")
            refs=$(gh api "repos/$GH_REPO/git/matching-refs/heads/$branch")
            prs=$(gh pr list --head "$branch" --state open --json number --jq length)
            if jq -e --arg ref "refs/heads/$branch" 'any(.[]; .ref == $ref)' <<< "$refs" > /dev/null || [ "$prs" != 0 ]; then
              echo "$branch already exists or has an open PR"
              updates='[]'
            fi
          fi
          echo "updates=$updates" >> "$GITHUB_OUTPUT"

  bump:
    needs: check
    if: needs.check.outputs.updates != '[]'
    strategy:
      fail-fast: false
      matrix:
        update: ${{ fromJSON(needs.check.outputs.updates) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PIN_UPDATE: ${{ toJSON(matrix.update) }}
      BRANCH: ${{ matrix.update.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ github.token }}
      - name: Update the pin and regenerate the adapter set
        shell: bash
        run: |
          git switch -c "$BRANCH"
          # Always advance the cutoff, including for CLI-only releases.
          python3 packaging/pins_watch.py apply
          nix develop -c cargo run -p hennery-pins --locked -- lock
          nix develop -c cargo run -p hennery-pins --locked -- generate
      - name: Commit and open the pin bump PR
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          title='chore(pins): update the managed agent runtime set'
          git add adapters/pins.toml adapters/claude/package.json adapters/claude/package-lock.json \
            adapters/codex/package.json adapters/codex/package-lock.json crates/hennery-host/manifest.json
          git diff --cached --stat
          git -c commit.gpgsign=false commit -m "$title"
          git push origin "$BRANCH"
          {
            printf 'Update the managed runtime pins and regenerate the adapter locks and manifest.\n\n'
            jq '.pins, {npm_before}' <<< "$PIN_UPDATE"
            cat <<'BODY'

          CLI/SDK versions are pinned explicitly, so this may override the adapter's declared dependency range. These are compatibility candidates, pending live acceptance.

          Before merging, run the `packaging/README.md` “Pin bumps” checklist, including all delegation matrix rows and lifecycle scenarios, and re-read the bundled Codex source and deletion contract. The generated `codex_app_server.codex_version` is a candidate version, not evidence that its contract has been verified.
          BODY
          } > "$RUNNER_TEMP/pr-body"
          gh pr create --base main --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/pr-body"
      # GITHUB_TOKEN-created PRs need explicit workflow dispatches.
      - name: Run CI and pins on the PR head
        shell: bash
        run: |
          gh workflow run ci.yml --ref "$BRANCH"
          gh workflow run pins.yml --ref "$BRANCH"
